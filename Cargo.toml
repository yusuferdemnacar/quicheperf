[package]
name = "quicheperf"
version = "0.1.0"
authors = ["Hendrik Cech <hendrik.cech@tum.de>"]
edition = "2021"
publish = false

[features]
# Enable quiche's fuzzing mode.
fuzzing = ["quiche/fuzzing"]

# Enable qlog support.
qlog = ["quiche/qlog"]

# Use BoringSSL provided by the boring crate.
boringssl-boring-crate = ["quiche/boringssl-boring-crate"]

# Enable sfv support.
sfv = ["quiche/sfv"]

default = ["qlog"]

[dependencies]
log4rs = { version = "1.3.0", default-features = false, features = ["file_appender", "console_appender", "threshold_filter"] }
mio = { version = "0.8", features = ["net", "os-poll"] }
url = "1"
log = "0.4"
ring = "0.16"
quiche = { git = "https://github.com/hendrikcech/quiche", default-features = false, features = ["boringssl-vendored"] }
qlog = { git = "https://github.com/hendrikcech/quiche" }
libc = "0.2"
nix = { version = "0.27.1", features = ["uio", "net", "socket"] }
slab = "0.4"
itertools = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_derive = "1.0"
serde_with = "1.3.1"
time = { version = "0.3.36", features = ["formatting", "local-offset", "macros"] }
lazy_static = { version = "1.4.0" }
zstd = { version = "0.12.0", features=["zstdmt"] }
synchronized-writer = "1.1.11"
git-testament = "0.2.1"
clap = { version = "4.1.4", features = ["derive", "env", "deprecated"] }
parse-size = "1.0.0"
ctrlc = "3.4.0"
riptun = { git = "https://github.com/hendrikcech/riptun.git", branch = "develop", default-features = false, features = ["mio-impl", "mio"] }
etherparse = "0.15.0"
